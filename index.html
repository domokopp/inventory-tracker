<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Inventory Tracker</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --surface-color: #ffffff;
            --surface-hover: #f1f5f9;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 240px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar h1 { font-size: 1.1rem; margin-bottom: 32px; font-weight: 600; color: var(--text-main); }
        .nav-btn {
            background: none; border: none; color: var(--text-muted);
            text-align: left; padding: 10px 12px; border-radius: 6px; cursor: pointer;
            margin-bottom: 4px; width: 100%; font-size: 0.9rem; transition: all 0.2s; font-weight: 500;
        }
        .nav-btn:hover { background-color: var(--surface-hover); color: var(--text-main); }
        .nav-btn.active { background-color: #eff6ff; color: var(--accent); }
        
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 15px;}
        .header h2 { font-size: 1.4rem; font-weight: 600; }
        
        .btn {
            background-color: var(--accent); color: white; border: none;
            padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: 0.2s;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .btn-secondary { background-color: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-secondary:hover { background-color: var(--surface-hover); }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: transparent; color: var(--danger); border: 1px solid transparent; padding: 4px;}
        .btn-danger:hover { background-color: #fee2e2; }
        .btn-icon { background: transparent; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; display: inline-flex; align-items: center; border-radius: 4px;}
        .btn-icon:hover { color: var(--accent); background-color: var(--surface-hover); }

        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.875rem; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; background: var(--bg-color);}
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: var(--surface-hover); }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        
        input[type="text"], input[type="number"], input[type="file"], select {
            background-color: var(--surface-color); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 6px 10px; border-radius: 6px; font-family: inherit; font-size: 0.85rem;
        }
        input:focus { outline: none; border-color: var(--accent); }
        .qty-input { width: 60px; }
        .checkbox { width: 16px; height: 16px; cursor: pointer; }
        
        .device-card {
            background-color: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 8px; margin-bottom: 12px; overflow: hidden;
        }
        .device-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; cursor: pointer; user-select: none; }
        .device-header:hover { background-color: var(--surface-hover); }
        .device-name { font-weight: 600; font-size: 1rem; display: flex; align-items: center; gap: 12px; }
        .built-badge { background: #ecfdf5; color: var(--success); padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 500;}
        
        .collapse-icon { transition: transform 0.2s; color: var(--text-muted); transform: rotate(-90deg); }
        .collapse-icon.expanded { transform: rotate(0deg); }
        
        .device-body { padding: 0 18px 18px 18px; display: none; }
        .device-body.expanded { display: block; padding-top: 16px; }
        
        .hidden { display: none !important; }
        .mt-2 { margin-top: 16px; }
        .text-muted { color: var(--text-muted); font-size: 0.85rem; }
        .actions-cell { width: 80px; text-align: right; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: var(--surface-color); padding: 24px; border-radius: 10px; width: 90%; max-width: 850px;
            max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;}
        .modal-header h3 { font-size: 1.1rem; font-weight: 600; }
        .modal-footer { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border-color); padding-top: 16px;}
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: var(--text-muted); font-weight: 500;}
        .form-group input, .form-group select { width: 100%; }
        .selection-counter { font-size: 0.85rem; color: var(--accent); margin-top: 8px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>Inventory Tracker</h1>
        <button class="nav-btn active" onclick="showView('devices', this)">Appareils & BOM</button>
        <button class="nav-btn" onclick="showView('inventory', this)">Inventaire</button>
        <button class="nav-btn" onclick="showView('finalBom', this)">BOM Finale & Build</button>
    </div>

    <div class="main">
        <!-- VUE APPAREILS -->
        <div id="view-devices">
            <div class="header">
                <h2>Appareils</h2>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-secondary" onclick="checkBomConflicts()">Analyser les conflits</button>
                    <button class="btn" onclick="openAddDeviceModal()">+ Ajouter un appareil</button>
                </div>
            </div>
            <div id="devices-list"></div>
        </div>

        <!-- VUE INVENTAIRE -->
        <div id="view-inventory" class="hidden">
            <div class="header">
                <h2>Inventaire des composants</h2>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-secondary" onclick="toggleInventoryEditMode()" id="inv-edit-btn">Éditer la liste</button>
                    <button class="btn btn-secondary" onclick="openAddManualInvModal()">+ Ajout Manuel</button>
                    <button class="btn" onclick="openAddFromBomModal()">+ Depuis une BOM</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Valeur</th><th>LCSC</th><th>Mouser</th><th>Quantité</th>
                        <th class="actions-cell inv-action-col hidden">Actions</th>
                    </tr>
                </thead>
                <tbody id="inventory-table-body"></tbody>
            </table>
        </div>

        <!-- VUE BOM FINALE -->
        <div id="view-finalBom" class="hidden">
            <div class="header">
                <h2>Génération & Construction</h2>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-secondary" onclick="generateFinalBom()">1. Générer la BOM</button>
                    <button class="btn btn-secondary" onclick="exportCsv()">2. Exporter CSV</button>
                    <button class="btn btn-success" onclick="buildDevices()">3. Construire</button>
                </div>
            </div>
            
            <div class="device-card" style="border: 1px solid var(--border-color); padding: 16px; background: var(--surface-color);">
                <h3 style="margin-bottom:12px; font-size:1rem;">Quantité à construire</h3>
                <div id="device-quantities" style="display: flex; flex-wrap: wrap; gap: 15px;"></div>
            </div>

            <div class="mt-2">
                <h3 style="font-size:1rem; margin-bottom:8px;">Aperçu de la BOM Finale</h3>
                <table>
                    <thead>
                        <tr><th>Valeur</th><th>Qté Totale</th><th>LCSC</th><th>Mouser</th></tr>
                    </thead>
                    <tbody id="final-bom-table-body">
                        <tr><td colspan="4" class="text-muted" style="text-align:center; padding: 30px;">Cliquez sur "Générer la BOM" pour calculer les composants nécessaires.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- STRUCTURE DES MODALES -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Titre</h3>
                <button class="btn-icon" onclick="closeModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <!-- LIBRAIRIES EXTERNES -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    
    <script>
        console.log("Inventory Tracker script loaded...");

        // --- INIT SUPABASE ---
        const SUPABASE_URL = 'https://yrugmjtuhoszddpiazzo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlydWdtanR1aG9zemRkcGlhenpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MDIwNDUsImV4cCI6MjEwMTA3ODA0NX0.eUt47YQKRtip2CwwNSr2BkFspgUl2qkKz200_WpFP_s';
        
        let db;
        if (window.supabase) {
            try {
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log("Supabase initialized successfully.");
            } catch (e) {
                console.error("Erreur d'initialisation Supabase.", e);
            }
        } else {
            console.error("Librairie Supabase non chargée.");
        }

        let currentDevices = [];
        let finalBomData = [];
        let isInventoryEditing = false;
        let bomEditStates = {}; 

        // --- NAVIGATION ---
        function showView(viewName, btn) {
            document.querySelectorAll('.main > div').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + viewName).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            if(viewName === 'devices') loadDevices();
            if(viewName === 'inventory') loadInventory();
            if(viewName === 'finalBom') loadDeviceQuantities();
        }

        // --- HELPERS ---
        function createSupplierLink(partNumber, supplier) {
            if (!partNumber || partNumber === '-' || partNumber === '') return '-';
            let url = '';
            if (supplier === 'lcsc') url = 'https://www.lcsc.com/search?q=' + partNumber;
            if (supplier === 'mouser') url = 'https://www.mouser.com/c/?q=' + partNumber;
            return '<a href="' + url + '" target="_blank">' + partNumber + '</a>';
        }

        // Normaliser les valeurs pour éviter les faux conflits (ex: 10µF vs 10uF)
        function normalizeValue(val) {
            if (!val) return '';
            return val.trim().toLowerCase().replace(/µ/g, 'u');
        }

        const IconTrash = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
        const IconEdit = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>';
        const IconChevron = '<svg class="collapse-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

        // --- MODALE GÉNÉRIQUE ---
        function openModal(title, bodyHtml, footerHtml) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-footer').innerHTML = footerHtml;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        // --- DEVICES & BOM ---
        async function loadDevices() {
            if(!db) return;
            const { data, error } = await db.from('devices').select('*').order('created_at', { ascending: false });
            if (error) return console.error(error);
            currentDevices = data;
            
            const container = document.getElementById('devices-list');
            container.innerHTML = '';
            
            if(data.length === 0) {
                container.innerHTML = '<p class="text-muted">Aucun appareil. Ajoutez-en un pour commencer.</p>';
                return;
            }

            for (const device of data) {
                const card = document.createElement('div');
                card.className = 'device-card';
                card.innerHTML = `
                    <div class="device-header" onclick="toggleCollapse(${device.id})">
                        <div class="device-name">
                            ${IconChevron}
                            ${device.name}
                            <span class="built-badge">Construits: ${device.built_count}</span>
                        </div>
                        <div onclick="event.stopPropagation()" style="display:flex; gap:8px;">
                            <button class="btn btn-secondary" onclick="openEditDeviceModal(${device.id})">Éditer</button>
                            <button class="btn btn-danger" onclick="deleteDevice(${device.id})">${IconTrash}</button>
                        </div>
                    </div>
                    <div class="device-body" id="bom-${device.id}"><p class="text-muted">Chargement...</p></div>
                `;
                container.appendChild(card);
                loadBomItems(device.id);
            }
        }

        function toggleCollapse(deviceId) {
            const body = document.getElementById('bom-' + deviceId);
            const icon = document.querySelector('#bom-' + deviceId).parentElement.querySelector('.collapse-icon');
            const isExpanded = body.classList.toggle('expanded');
            icon.classList.toggle('expanded', isExpanded);
        }

        function openAddDeviceModal() {
            const body = `
                <div class="form-group">
                    <label>Nom de l'appareil</label>
                    <input type="text" id="modal-device-name" placeholder="Ex: Carte Mère V2">
                </div>
                <div class="form-group">
                    <label>Importer BOM CSV (Optionnel)</label>
                    <input type="file" id="modal-device-csv" accept=".csv">
                </div>
            `;
            const footer = `<button class="btn btn-secondary" onclick="closeModal()">Annuler</button><button class="btn" onclick="submitAddDevice()">Créer l'appareil</button>`;
            openModal("Ajouter un appareil", body, footer);
        }

        async function submitAddDevice() {
            if(!db) return alert("Supabase n'est pas initialisé.");
            const name = document.getElementById('modal-device-name').value.trim();
            const fileInput = document.getElementById('modal-device-csv');
            if(!name) return alert("Entrez un nom");

            const { data: newDevice, error: errDev } = await db.from('devices').insert([{ name: name, built_count: 0 }]).select();
            if(errDev) return console.error(errDev);
            
            if(fileInput.files[0]) {
                await importCsv(newDevice[0].id, fileInput.files[0]);
            }
            closeModal();
            loadDevices();
        }

        async function openEditDeviceModal(id) {
            const device = currentDevices.find(d => d.id === id);
            const body = `
                <div class="form-group">
                    <label>Nom de l'appareil</label>
                    <input type="text" id="modal-edit-device-name" value="${device.name}">
                </div>
            `;
            const footer = `<button class="btn btn-secondary" onclick="closeModal()">Annuler</button><button class="btn" onclick="submitEditDevice(${id})">Sauvegarder</button>`;
            openModal("Éditer l'appareil", body, footer);
        }

        async function submitEditDevice(id) {
            const name = document.getElementById('modal-edit-device-name').value.trim();
            const { error } = await db.from('devices').update({ name: name }).eq('id', id);
            if(error) console.error(error);
            closeModal();
            loadDevices();
        }

        async function deleteDevice(id) {
            if(!confirm("Supprimer cet appareil et toute sa BOM ?")) return;
            const { error } = await db.from('devices').delete().eq('id', id);
            if(error) return console.error(error);
            loadDevices();
        }

        async function loadBomItems(deviceId) {
            const { data, error } = await db.from('bom_items').select('*').eq('device_id', deviceId).order('id', { ascending: true });
            if(error) return console.error(error);
            
            const bomDiv = document.getElementById('bom-' + deviceId);
            if(!bomEditStates[deviceId]) bomEditStates[deviceId] = false;

            if(data.length === 0) {
                bomDiv.innerHTML = '<p class="text-muted">Aucun composant.</p>';
                return;
            }

            let html = `
                <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                    <button class="btn btn-secondary" onclick="toggleBomEditMode(${deviceId})" id="bom-edit-btn-${deviceId}">
                        ${bomEditStates[deviceId] ? 'Terminer' : 'Éditer la liste'}
                    </button>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <input type="file" id="csv-add-${deviceId}" accept=".csv" style="display:none;" onchange="importCsv(${deviceId}, this.files[0])">
                        <button class="btn btn-secondary" onclick="document.getElementById('csv-add-${deviceId}').click()">Importer CSV</button>
                        <button class="btn" onclick="openAddManualBomModal(${deviceId})">+ Composant</button>
                    </div>
                </div>
                <table>
                    <thead><tr><th>Réf</th><th>Valeur</th><th>Qté</th><th>LCSC</th><th>Mouser</th><th>Exclure</th><th class="actions-cell ${bomEditStates[deviceId] ? '' : 'hidden'}">Actions</th></tr></thead>
                    <tbody>
            `;
            for (const item of data) {
                html += `
                    <tr>
                        <td>${item.reference || '-'}</td>
                        <td>${item.value || '-'}</td>
                        <td>${item.qty}</td>
                        <td>${createSupplierLink(item.lcsc, 'lcsc')}</td>
                        <td>${createSupplierLink(item.mouser, 'mouser')}</td>
                        <td><input type="checkbox" class="checkbox" ${item.excluded ? 'checked' : ''} onchange="toggleExclude(${item.id}, this)"></td>
                        <td class="actions-cell ${bomEditStates[deviceId] ? '' : 'hidden'}" style="text-align:right;">
                            <button class="btn-icon" onclick="openEditBomModal(${item.id}, ${deviceId})">${IconEdit}</button>
                            <button class="btn-icon" style="color:var(--danger);" onclick="deleteBomItem(${item.id}, ${deviceId})">${IconTrash}</button>
                        </td>
                    </tr>
                `;
            }
            html += `</tbody></table>`;
            bomDiv.innerHTML = html;
        }

        function toggleBomEditMode(deviceId) {
            bomEditStates[deviceId] = !bomEditStates[deviceId];
            loadBomItems(deviceId);
        }

        async function importCsv(deviceId, file) {
            if(!file) return;
            Papa.parse(file, {
                header: true,
                complete: async function(results) {
                    const rows = results.data.map(row => ({
                        device_id: deviceId,
                        reference: (row['Reference'] || row['Ref'] || '').trim(),
                        qty: parseInt(row['Qty']) || 1,
                        value: (row['Value'] || '').trim(),
                        lcsc: (row['LCSC part number'] || row['LCSC'] || '').trim(),
                        mouser: (row['Mouser part number'] || row['Mouser'] || '').trim(),
                        excluded: false,
                        is_manual: false
                    })).filter(r => r.value !== '' || r.reference !== '');

                    if(rows.length === 0) return alert("Aucune donnée valide trouvée.");
                    const { error } = await db.from('bom_items').insert(rows);
                    if(error) return console.error(error);
                    alert(rows.length + ' composants importés !');
                    loadBomItems(deviceId);
                }
            });
        }

        async function toggleExclude(itemId, checkbox) {
            const { error } = await db.from('bom_items').update({ excluded: checkbox.checked }).eq('id', itemId);
            if(error) console.error(error);
        }

        function openAddManualBomModal(deviceId) {
            const body = `
                <div class="form-group"><label>Réf (Optionnel)</label><input type="text" id="m-ref"></div>
                <div class="form-group"><label>Valeur</label><input type="text" id="m-val"></div>
                <div class="form-group"><label>Quantité</label><input type="number" id="m-qty" value="1"></div>
                <div class="form-group"><label>LCSC Part #</label><input type="text" id="m-lcsc"></div>
                <div class="form-group"><label>Mouser Part #</label><input type="text" id="m-mouser"></div>
            `;
            const footer = `<button class="btn btn-secondary" onclick="closeModal()">Annuler</button><button class="btn" onclick="submitAddManualBom(${deviceId})">Ajouter</button>`;
            openModal("Ajouter un composant", body, footer);
        }

        async function submitAddManualBom(deviceId) {
            const { error } = await db.from('bom_items').insert([{
                device_id: deviceId,
                reference: document.getElementById('m-ref').value.trim(),
                value: document.getElementById('m-val').value.trim(),
                qty: parseInt(document.getElementById('m-qty').value) || 1,
                lcsc: document.getElementById('m-lcsc').value.trim(),
                mouser: document.getElementById('m-mouser').value.trim(),
                is_manual: true
            }]);
            if(error) console.error(error);
            closeModal();
            loadBomItems(deviceId);
        }

        async function openEditBomModal(itemId, deviceId) {
            const { data: item, error } = await db.from('bom_items').select('*').eq('id', itemId).single();
            if(error) return console.error(error);

            const body = `
                <div class="form-group"><label>Réf</label><input type="text" id="e-ref" value="${item.reference || ''}"></div>
                <div class="form-group"><label>Valeur</label><input type="text" id="e-val" value="${item.value || ''}"></div>
                <div class="form-group"><label>Quantité</label><input type="number" id="e-qty" value="${item.qty}"></div>
                <div class="form-group"><label>LCSC Part #</label><input type="text" id="e-lcsc" value="${item.lcsc || ''}"></div>
                <div class="form-group"><label>Mouser Part #</label><input type="text" id="e-mouser" value="${item.mouser || ''}"></div>
            `;
            const footer = `<button class="btn btn-secondary" onclick="closeModal()">Annuler</button><button class="btn" onclick="submitEditBom(${itemId}, ${deviceId})">Sauvegarder</button>`;
            openModal("Éditer le composant", body, footer);
        }

        async function submitEditBom(itemId, deviceId) {
            const { error } = await db.from('bom_items').update({
                reference: document.getElementById('e-ref').value.trim(),
                value: document.getElementById('e-val').value.trim(),
                qty: parseInt(document.getElementById('e-qty').value) || 1,
                lcsc: document.getElementById('e-lcsc').value.trim(),
                mouser: document.getElementById('e-mouser').value.trim()
            }).eq('id', itemId);
            if(error) console.error(error);
            closeModal();
            loadBomItems(deviceId);
        }

        async function deleteBomItem(itemId, deviceId) {
            const { error } = await db.from('bom_items').delete().eq('id', itemId);
            if(error) return console.error(error);
            loadBomItems(deviceId);
        }

        // --- NOUVELLE FONCTION : ANALYSE DES CONFLITS ---
        async function checkBomConflicts() {
            if(!db) return;
            const { data: items, error } = await db.from('bom_items').select('*, devices(name)').order('value');
            if(error) return console.error(error);

            const byValue = {};
            items.forEach(item => {
                const val = normalizeValue(item.value);
                if(val === '') return; // Ignore les valeurs vides

                if(!byValue[val]) byValue[val] = [];
                byValue[val].push(item);
            });

            const conflicts = [];
            for(const val in byValue) {
                const itemsWithVal = byValue[val];
                if(itemsWithVal.length > 1) {
                    const uniqueParts = {};
                    itemsWithVal.forEach(item => {
                        const lcsc = (item.lcsc || '').trim();
                        const mouser = (item.mouser || '').trim();
                        const key = lcsc + '|' + mouser;
                        if(!uniqueParts[key]) {
                            uniqueParts[key] = { lcsc, mouser, sources: [] };
                        }
                        uniqueParts[key].sources.push((item.devices && item.devices.name ? item.devices.name : 'N/A') + ' (' + item.qty + ')');
                    });

                    const partCount = Object.keys(uniqueParts).length;
                    if(partCount > 1) {
                        conflicts.push({
                            value: itemsWithVal[0].value, // Conserve la casse d'origine pour l'affichage
                            parts: Object.values(uniqueParts)
                        });
                    }
                }
            }

            displayConflictModal(conflicts);
        }

        function displayConflictModal(conflicts) {
            let bodyHtml = '';
            if(conflicts.length === 0) {
                bodyHtml = '<p class="text-muted" style="text-align:center; padding: 20px;">Aucun conflit trouvé. Toutes les références pour une même valeur sont identiques.</p>';
            } else {
                bodyHtml = `<p class="text-muted" style="margin-bottom:16px;">${conflicts.length} valeur(s) avec des références (LCSC/Mouser) différentes :</p>`;
                bodyHtml += '<div style="max-height: 400px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 8px;">';
                bodyHtml += '<table style="margin-top:0; border:none;">';
                bodyHtml += '<thead style="position: sticky; top: 0; background: var(--bg-color); z-index: 1;"><tr><th>Valeur</th><th>LCSC</th><th>Mouser</th><th>Présent dans</th></tr></thead><tbody>';

                conflicts.forEach(conf => {
                    conf.parts.forEach((part, index) => {
                        const valCell = index === 0 ? `<td rowspan="${conf.parts.length}" style="font-weight:600; vertical-align:top; background: var(--surface-hover);">${conf.value}</td>` : '';
                        bodyHtml += `
                            <tr>
                                ${valCell}
                                <td>${createSupplierLink(part.lcsc, 'lcsc')}</td>
                                <td>${createSupplierLink(part.mouser, 'mouser')}</td>
                                <td class="text-muted" style="font-size:0.8rem;">${part.sources.join(', ')}</td>
                            </tr>
                        `;
                    });
                });

                bodyHtml += '</tbody></table></div>';
            }

            const footer = `<button class="btn" onclick="closeModal()">Fermer</button>`;
            openModal("Analyse des conflits", bodyHtml, footer);
        }

        // --- INVENTORY ---
        async function loadInventory() {
            if(!db) return;
            const { data, error } = await db.from('inventory').select('*').order('value', { ascending: true });
            if(error) return console.error(error);
            
            const tbody = document.getElementById('inventory-table-body');
            const actionCol = document.querySelector('.inv-action-col');
            
            if(isInventoryEditing) actionCol.classList.remove('hidden');
            else actionCol.classList.add('hidden');

            document.getElementById('inv-edit-btn').innerText = isInventoryEditing ? 'Terminer' : 'Éditer la liste';

            tbody.innerHTML = '';
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-muted" style="text-align:center; padding: 20px;">Inventaire vide.</td></tr>';
                return;
            }
            for (const item of data) {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.value || '-'}</td>
                        <td>${createSupplierLink(item.lcsc, 'lcsc')}</td>
                        <td>${createSupplierLink(item.mouser, 'mouser')}</td>
                        <td><input type="number" class="qty-input" value="${item.qty}" onchange="updateInventoryQty(${item.id}, this.value)"></td>
                        <td class="actions-cell ${isInventoryEditing ? '' : 'hidden'}" style="text-align:right;">
                            <button class="btn-icon" onclick="openEditInvModal(${item.id})">${IconEdit}</button>
                            <button class="btn-icon" style="color:var(--danger);" onclick="deleteInventoryItem(${item.id})">${IconTrash}</button>
                        </td>
                    </tr>
                `;
            }
        }

        function toggleInventoryEditMode() {
            isInventoryEditing = !isInventoryEditing;
            loadInventory();
        }

        async function updateInventoryQty(id, newQty) {
            const { error } = await db.from('inventory').update({ qty: parseInt(newQty) }).eq('id', id);
            if(error) console.error(error);
        }

        async function deleteInventoryItem(id) {
            const { error } = await db.from('inventory').delete().eq('id', id);
            if(error) return console.error(error);
            loadInventory();
        }

        function openAddManualInvModal() {
            const body = `
                <div class="form-group"><label>Valeur</label><input type="text" id="i-val"></div>
                <div class="form-group"><label>Quantité</label><input type="number" id="i-qty" value="0"></div>
                <div class="form-group"><label>LCSC Part #</label><input type="text" id="i-lcsc"></div>
                <div class="form-group"><label>Mouser Part #</label><input type="text" id="i-mouser"></div>
            `;
            const footer = `<button class="btn btn-secondary" onclick="closeModal()">Annuler</button><button class="btn" onclick="submitAddManualInv()">Ajouter</button>`;
            openModal("Ajout Manuel Inventaire", body, footer);
        }

        async function submitAddManualInv() {
            const { error } = await db.from('inventory').insert([{
                value: document.getElementById('i-val').value.trim(),
                qty: parseInt(document.getElementById('i-qty').value) || 0,
                lcsc: document.getElementById('i-lcsc').value.trim(),
                mouser: document.getElementById('i-mouser').value.trim()
            }]);
            if(error) console.error(error);
            closeModal();
            loadInventory();
        }

        async function openEditInvModal(id) {
            const { data: item, error } = await db.from('inventory').select('*').eq('id', id).single();
            if(error) return console.error(error);

            const body = `
                <div class="form-group"><label>Valeur</label><input type="text" id="ie-val" value="${item.value || ''}"></div>
                <div class="form-group"><label>Quantité</label><input type="number" id="ie-qty" value="${item.qty}"></div>
                <div class="form-group"><label>LCSC Part #</label><input type="text" id="ie-lcsc" value="${item.lcsc || ''}"></div>
                <div class="form-group"><label>Mouser Part #</label><input type="text" id="ie-mouser" value="${item.mouser || ''}"></div>
            `;
            const footer = `<button class="btn btn-secondary" onclick="closeModal()">Annuler</button><button class="btn" onclick="submitEditInv(${id})">Sauvegarder</button>`;
            openModal("Éditer le composant", body, footer);
        }

        async function submitEditInv(id) {
            const { error } = await db.from('inventory').update({
                value: document.getElementById('ie-val').value.trim(),
                qty: parseInt(document.getElementById('ie-qty').value) || 0,
                lcsc: document.getElementById('ie-lcsc').value.trim(),
                mouser: document.getElementById('ie-mouser').value.trim()
            }).eq('id', id);
            if(error) console.error(error);
            closeModal();
            loadInventory();
        }

        // --- POPUP: AJOUTER DEPUIS BOM ---
        async function openAddFromBomModal() {
            if(!db) return;
            const { data: items, error } = await db.from('bom_items').select('*, devices(name)').order('id');
            if(error) return console.error(error);

            const grouped = {};
            items.forEach(item => {
                const val = (item.value || '').trim();
                const lcsc = (item.lcsc || '').trim();
                const mouser = (item.mouser || '').trim();
                const key = val + '|' + lcsc + '|' + mouser;
                
                if(!grouped[key]) {
                    grouped[key] = { value: val, lcsc: lcsc, mouser: mouser, sources: [] };
                }
                grouped[key].sources.push((item.devices && item.devices.name ? item.devices.name : 'N/A') + ' (' + item.qty + ')');
            });

            const components = Object.values(grouped);
            window.tempBomComponents = components;
            window.bomModalState = {}; 
            
            components.forEach((c, i) => {
                window.bomModalState[i] = { checked: false, qty: 0 };
            });

            const body = `
                <div class="form-group">
                    <input type="text" id="bom-search" placeholder="Rechercher (Valeur, LCSC, Mouser)..." oninput="filterBomModal()" style="width: 100%; margin-bottom: 16px;">
                </div>
                <div style="max-height: 400px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 8px;">
                    <table style="width: 100%; margin-top:0; border:none; table-layout: auto;">
                        <thead style="position: sticky; top: 0; background: var(--bg-color); z-index: 1;">
                            <tr>
                                <th style="width: 40px;"></th>
                                <th>Valeur</th>
                                <th>LCSC</th>
                                <th>Mouser</th>
                                <th>Dans les BOMs</th>
                                <th style="width: 100px;">Qté à ajouter</th>
                            </tr>
                        </thead>
                        <tbody id="bom-modal-tbody"></tbody>
                    </table>
                </div>
                <div class="selection-counter" id="selection-counter">0 composant sélectionné</div>
            `;
            const footer = `<button class="btn btn-secondary" onclick="closeModal()">Annuler</button><button class="btn" onclick="submitAddFromBom()">Ajouter à l'inventaire</button>`;
            
            openModal("Ajouter depuis une BOM", body, footer);
            renderBomModalTable();
        }

        function renderBomModalTable() {
            const query = document.getElementById('bom-search').value.toLowerCase();
            const tbody = document.getElementById('bom-modal-tbody');
            tbody.innerHTML = '';

            window.tempBomComponents.forEach((c, i) => {
                const matchesSearch = !query || 
                    (c.value && c.value.toLowerCase().includes(query)) || 
                    (c.lcsc && c.lcsc.toLowerCase().includes(query)) || 
                    (c.mouser && c.mouser.toLowerCase().includes(query));

                if (matchesSearch) {
                    const state = window.bomModalState[i];
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><input type="checkbox" class="checkbox" ${state.checked ? 'checked' : ''} onchange="toggleBomModalItem(${i}, this.checked)"></td>
                        <td>${c.value || '-'}</td>
                        <td>${createSupplierLink(c.lcsc, 'lcsc')}</td>
                        <td>${createSupplierLink(c.mouser, 'mouser')}</td>
                        <td class="text-muted" style="font-size:0.8rem;">${c.sources.join(', ')}</td>
                        <td><input type="number" class="qty-input" min="0" value="${state.qty}" oninput="updateBomModalQty(${i}, this)" style="width: 70px;"></td>
                    `;
                    tbody.appendChild(tr);
                }
            });
        }

        function filterBomModal() {
            renderBomModalTable();
        }

        function toggleBomModalItem(index, isChecked) {
            window.bomModalState[index].checked = isChecked;
            updateSelectionCounter();
            renderBomModalTable(); 
        }

        function updateBomModalQty(index, inputElement) {
            let q = parseInt(inputElement.value) || 0;
            if (q < 0) {
                q = 0;
                inputElement.value = 0;
            }
            window.bomModalState[index].qty = q;
            
            if (q > 0 && !window.bomModalState[index].checked) {
                window.bomModalState[index].checked = true;
                const row = inputElement.closest('tr');
                const checkbox = row.querySelector('input[type="checkbox"]');
                if (checkbox) checkbox.checked = true;
                updateSelectionCounter();
            }
        }

        function updateSelectionCounter() {
            const count = Object.values(window.bomModalState).filter(s => s.checked).length;
            document.getElementById('selection-counter').innerText = count + ' composant' + (count > 1 ? 's' : '') + ' sélectionné' + (count > 1 ? 's' : '');
        }

        async function submitAddFromBom() {
            const itemsToProcess = [];
            window.tempBomComponents.forEach((comp, i) => {
                const state = window.bomModalState[i];
                if(state.checked && state.qty > 0) {
                    itemsToProcess.push({ ...comp, addQty: state.qty });
                }
            });

            if(itemsToProcess.length === 0) return alert("Sélectionnez au moins un composant avec une quantité supérieure à 0.");

            const { data: invItems } = await db.from('inventory').select('*');
            
            for (const item of itemsToProcess) {
                let existing = invItems.find(i => 
                    (i.lcsc === item.lcsc || (!i.lcsc && !item.lcsc)) && 
                    (i.mouser === item.mouser || (!i.mouser && !item.mouser))
                );

                if(existing) {
                    await db.from('inventory').update({ qty: existing.qty + item.addQty }).eq('id', existing.id);
                } else {
                    await db.from('inventory').insert([{ 
                        value: item.value, lcsc: item.lcsc, mouser: item.mouser, qty: item.addQty 
                    }]);
                }
            }

            closeModal();
            loadInventory();
        }

        // --- FINAL BOM & BUILD ---
        async function loadDeviceQuantities() {
            if(!db) return;
            const { data, error } = await db.from('devices').select('*');
            if(error) return console.error(error);
            
            const container = document.getElementById('device-quantities');
            container.innerHTML = '';
            if(data.length === 0) container.innerHTML = '<p class="text-muted">Aucun appareil.</p>';
            
            for (const dev of data) {
                container.innerHTML += `
                    <label style="display:inline-flex; align-items:center; gap:8px; background: var(--bg-color); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color);">
                        ${dev.name} <input type="number" class="qty-input" id="qty-${dev.id}" value="0" min="0">
                    </label>
                `;
            }
        }

        async function generateFinalBom() {
            const { data: devices } = await db.from('devices').select('*');
            const quantities = {};
            let hasSelection = false;

            for (const dev of devices) {
                const qty = parseInt(document.getElementById('qty-' + dev.id).value) || 0;
                if(qty > 0) {
                    quantities[dev.id] = qty;
                    hasSelection = true;
                }
            }

            if(!hasSelection) return alert("Entrez une quantité supérieure à 0 pour au moins un appareil.");

            finalBomData = [];
            for (const devId in quantities) {
                const qtyToBuild = quantities[devId];
                const { data: items } = await db.from('bom_items').select('*').eq('device_id', devId).eq('excluded', false);
                for (const item of items) {
                    const key = (item.value || '').trim() + '|' + (item.lcsc || '').trim() + '|' + (item.mouser || '').trim();
                    if(!finalBomData[key]) {
                        finalBomData[key] = { value: (item.value || '').trim(), lcsc: (item.lcsc || '').trim(), mouser: (item.mouser || '').trim(), totalQty: 0 };
                    }
                    finalBomData[key].totalQty += item.qty * qtyToBuild;
                }
            }
            finalBomData = Object.values(finalBomData);

            const tbody = document.getElementById('final-bom-table-body');
            tbody.innerHTML = '';
            for (const item of finalBomData) {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.value || '-'}</td>
                        <td><strong>${item.totalQty}</strong></td>
                        <td>${createSupplierLink(item.lcsc, 'lcsc')}</td>
                        <td>${createSupplierLink(item.mouser, 'mouser')}</td>
                    </tr>
                `;
            }
        }

        function exportCsv() {
            if(finalBomData.length === 0) return alert("Générez d'abord la BOM.");
            
            let csv = "Value,Qty,LCSC part number,Mouser part number\n";
            for (const item of finalBomData) {
                csv += '"' + (item.value || '') + '",' + item.totalQty + ',"' + (item.lcsc || '') + '","' + (item.mouser || '') + '"\n';
            }

            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "bom_finale.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function buildDevices() {
            if(finalBomData.length === 0) return alert("Générez d'abord la BOM finale avant de construire.");
            
            const quantities = {};
            const { data: devices } = await db.from('devices').select('*');
            let confirmMsg = "Confirmer la construction de :\n";
            let hasSelection = false;

            for (const dev of devices) {
                const qty = parseInt(document.getElementById('qty-' + dev.id).value) || 0;
                if(qty > 0) {
                    quantities[dev.id] = qty;
                    confirmMsg += '- ' + qty + 'x ' + dev.name + '\n';
                    hasSelection = true;
                }
            }

            if(!hasSelection) return alert("Rien à construire.");
            if(!confirm(confirmMsg + "\nCela va soustraire les composants de l'inventaire et incrémenter les compteurs.")) return;

            const { error } = await db.rpc('build_devices', { p_quantities: quantities });
            if(error) {
                alert("Erreur lors de la mise à jour. Vérifiez la console.");
                return console.error(error);
            }

            alert("Construction enregistrée ! L'inventaire a été mis à jour.");
            for (const dev of devices) {
                document.getElementById('qty-' + dev.id).value = 0;
            }
            generateFinalBom(); 
            loadDevices(); 
        }

        // Init
        loadDevices();
    </script>
</body>
</html>
