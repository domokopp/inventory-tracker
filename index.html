<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Inventory Tracker</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --surface-color: #ffffff;
            --surface-hover: #f1f5f9;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning-bg: #fef2f2;
            --warning-border: #fecaca;
            --conflict-bg: #fffbeb;
            --conflict-border: #fef3c7;
            --conflict-text: #d97706;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 240px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar h1 { font-size: 1.1rem; margin-bottom: 32px; font-weight: 600; color: var(--text-main); }
        .nav-btn {
            background: none; border: none; color: var(--text-muted);
            text-align: left; padding: 10px 12px; border-radius: 6px; cursor: pointer;
            margin-bottom: 4px; width: 100%; font-size: 0.9rem; transition: all 0.2s; font-weight: 500;
        }
        .nav-btn:hover { background-color: var(--surface-hover); color: var(--text-main); }
        .nav-btn.active { background-color: #eff6ff; color: var(--accent); }
        
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 15px;}
        .header h2 { font-size: 1.4rem; font-weight: 600; }
        
        .btn {
            background-color: var(--accent); color: white; border: none;
            padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: 0.2s;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .btn-secondary { background-color: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-secondary:hover { background-color: var(--surface-hover); }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: transparent; color: var(--danger); border: 1px solid transparent; padding: 4px 8px;}
        .btn-danger:hover { background-color: #fee2e2; }
        .btn-icon { background: transparent; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; display: inline-flex; align-items: center; border-radius: 4px;}
        .btn-icon:hover { color: var(--accent); background-color: var(--surface-hover); }

        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.875rem; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; background: var(--bg-color);}
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: var(--surface-hover); }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        
        input[type="text"], input[type="number"], input[type="file"], select {
            background-color: var(--surface-color); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 6px 10px; border-radius: 6px; font-family: inherit; font-size: 0.85rem;
        }
        input:focus { outline: none; border-color: var(--accent); }
        .qty-input { width: 60px; }
        .checkbox { width: 16px; height: 16px; cursor: pointer; }
        
        .device-card {
            background-color: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 8px; margin-bottom: 12px; overflow: hidden;
        }
        .device-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; cursor: pointer; user-select: none; }
        .device-header:hover { background-color: var(--surface-hover); }
        .device-name { font-weight: 600; font-size: 1rem; display: flex; align-items: center; gap: 12px; }
        .built-badge { background: #ecfdf5; color: var(--success); padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 500;}
        
        .collapse-icon { transition: transform 0.2s; color: var(--text-muted); transform: rotate(-90deg); }
        .collapse-icon.expanded { transform: rotate(0deg); }
        
        .device-body { padding: 0 18px 18px 18px; display: none; }
        .device-body.expanded { display: block; padding-top: 16px; }
        
        .hidden { display: none !important; }
        .mt-2 { margin-top: 16px; }
        .text-muted { color: var(--text-muted); font-size: 0.85rem; }
        .text-danger { color: var(--danger); font-weight: 500; }
        .actions-cell { width: 100px; text-align: right; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: var(--surface-color); padding: 24px; border-radius: 10px; width: 90%; max-width: 850px;
            max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 0;}
        .modal-header h3 { font-size: 1.1rem; font-weight: 600; }
        .modal-footer { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; padding-top: 0;}
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: var(--text-muted); font-weight: 500;}
        .form-group input, .form-group select { width: 100%; }
        .selection-counter { font-size: 0.85rem; color: var(--accent); margin-top: 8px; font-weight: 500; }

        .missing-card {
            background-color: var(--warning-bg); border: 1px solid var(--warning-border);
            border-radius: 8px; padding: 16px; margin-top: 16px;
        }
        .missing-card h3 { color: var(--danger); font-size: 1rem; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

        .conflict-card {
            background-color: var(--conflict-bg); border: 1px solid var(--conflict-border);
            border-radius: 8px; padding: 16px; margin-top: 16px; margin-bottom: 24px;
        }
        .conflict-card h3 { color: var(--conflict-text); font-size: 1rem; margin-bottom: 16px; }
        .conflict-section-title { font-size: 0.9rem; color: var(--text-main); font-weight: 600; margin-bottom: 8px; margin-top: 16px; }
        .conflict-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 6px; margin-bottom: 8px;
        }
        .conflict-info { font-size: 0.85rem; line-height: 1.4; }
        .conflict-actions { display: flex; gap: 8px; flex-shrink: 0; }

        .sub-dropdown { border: 1px solid var(--border-color); border-radius: 6px; max-height: 250px; overflow-y: auto; margin-top: 4px; }
        .sub-option { padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .sub-option:last-child { border-bottom: none; }
        .sub-option:hover { background-color: var(--surface-hover); }
        .sub-option.selected { background-color: #eff6ff; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>Inventory Tracker</h1>
        <button class="nav-btn active" onclick="showView('devices', this)">Appareils & BOM</button>
        <button class="nav-btn" onclick="showView('inventory', this)">Inventaire</button>
        <button class="nav-btn" onclick="showView('finalBom', this)">BOM Finale & Build</button>
    </div>

    <div class="main">
        <!-- VUE APPAREILS -->
        <div id="view-devices">
            <div class="header">
                <h2>Appareils</h2>
                <div style="display:flex; gap:8px; flex-wrap: wrap;">
                    <button class="btn btn-secondary" onclick="loadAndAnalyzeConflicts()">Analyser les conflits</button>

            </div>
            
            <div id="conflicts-section" class="hidden"></div>
            
            <div id="devices-list"></div>

        <!-- VUE INVENTAIRE -->

                    <button class="btn btn-secondary" onclick="toggleInventoryEditMode()" id="inv-edit-btn">Éditer la liste</button>

            </div>
            <input type="text" id="inv-search" placeholder="Rechercher dans l'inventaire (Valeur, LCSC, Mouser)..." oninput="filterInventory()" style="width: 100%; max-width: 500px; margin-bottom: 10px;">
            <table>

                        <th>Valeur</th><th>LCSC</th><th>Mouser</th><th>Quantité</th>

                        <th style="width: 40px;"></th>

                </thead>
                <tbody id="inventory-table-body"></tbody>
            </table>
        </div>

        <!-- VUE BOM FINALE -->
        <div id="view-finalBom" class="hidden">
            <div class="header">
                <h2>Génération & Construction</h2>
                <button class="btn btn-secondary" onclick="generateFinalBom()">Générer la BOM</button>
            </div>
            
            <div class="device-card" style="border: 1px solid var(--border-color); padding: 16px; background: var(--surface-color);">
                <h3 style="margin-bottom:12px; font-size:1rem;">Quantité à construire</h3>
                <div id="device-quantities" style="display: flex; flex-wrap: wrap; gap: 15px;"></div>
            </div>

            <div id="missing-components-section" class="hidden"></div>

            <div id="final-bom-section" class="hidden">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; margin-bottom: 8px;">
                    <h3 style="font-size:1rem; margin:0;">Aperçu de la BOM Finale</h3>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn-icon" onclick="exportCsv()" title="Télécharger la BOM finale CSV">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        </button>
                        <button class="btn btn-success" onclick="buildDevices()">Construire</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr><th>Valeur</th><th>Qté Totale</th><th>LCSC</th><th>Mouser</th><th style="width: 40px;"></th></tr>

                    <tbody id="final-bom-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- STRUCTURE DES MODALES -->
    <div id="modal-overlay" class="modal-overlay hidden" onclick="overlayClick(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Titre</h3>
                <button class="btn-icon" onclick="handlePromiseModal(false)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

        // --- INIT SUPABASE ---
        const SUPABASE_URL = 'https://yrugmjtuhoszddpiazzo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlydWdtanR1aG9zemRkcGlhenpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MDIwNDUsImV4cCI6MjEwMTA3ODA0NX0.eUt47YQKRtip2CwwNSr2BkFspgUl2qkKz200_WpFP_s';
        
        let db;
        if (window.supabase) {
            try {
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log("Supabase initialized successfully.");
            } catch (e) {
                console.error("Erreur d'initialisation Supabase.", e);
            }
        } else {
            console.error("Librairie Supabase non chargée.");
        }

        let currentDevices = [];
        let currentInventory = [];
        let finalBomData = {}; 
        let missingData = []; 
        let activeSubstitutions = []; 
        let isInventoryEditing = false;
        let bomEditStates = {}; 
        let currentValConflicts = [];
        let currentRefConflicts = [];
        let currentNonStandardItems = [];

        // --- NAVIGATION ---
        function showView(viewName, btn) {
            document.querySelectorAll('.main > div').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + viewName).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            if(viewName === 'devices') loadDevices();
            if(viewName === 'inventory') loadInventory();
            if(viewName === 'finalBom') loadDeviceQuantities();
        }

        // --- HELPERS ---
        function createSupplierLink(partNumber, supplier) {
            if (!partNumber || partNumber === '-' || partNumber === '') return '-';
            let url = '';
            if (supplier === 'lcsc') url = 'https://www.lcsc.com/search?q=' + partNumber;
            if (supplier === 'mouser') url = 'https://www.mouser.com/c/?q=' + partNumber;
            return '<a href="' + url + '" target="_blank">' + partNumber + '</a>';
        }

        function normalizeValue(val) {
            if (!val) return '';
            return val.trim().toLowerCase().replace(/µ/g, 'u');
        }

        function standardizeValue(val, ref = '') {
            if (!val) return '';
            let refType = '';
            if (/^C\d+/i.test(ref)) refType = 'F';
            else if (/^R\d+/i.test(ref)) refType = 'Ω';
            else if (/^L\d+/i.test(ref)) refType = 'H';
            if (!refType) return val;
            
            let v = val.trim().replace(',', '.');
            v = v.replace(/\s+/g, '');
            if (/^\d+(\.\d+)?$/.test(v)) return v + refType;
            
            let match = v.match(/^(\d+)([RrKkMmPpNnUuµ])(\d+)$/);
            if (match) v = match[1] + '.' + match[3] + match[2];
            if (!/^[\d\.]+[a-zA-ZµΩ]*$/.test(v)) return v;
            v = v.replace(/[uU]/g, 'µ').replace(/[rR]/g, 'Ω').replace(/ohm/i, 'Ω');
            match = v.match(/^([\d\.]+)([pPnNµmkKMgG]?)([fFhHΩωvVaAwW]?)$/);
            if (!match) return v; 
            
            let num = parseFloat(match[1]);
            let prefix = match[2];
            let unit = match[3];
            if (isNaN(num)) return v;

            let type = refType;
            if (unit) {
                if (unit === 'f' || unit === 'F') type = 'F';
                else if (unit === 'h' || unit === 'H') type = 'H';
                else if (unit === 'Ω' || unit === 'ω') type = 'Ω';
            }
            
            let baseValue = num;
            let p = prefix.toLowerCase();
            let origPrefix = match[2];
            if (p === 'p') baseValue *= 1e-12;
            else if (p === 'n') baseValue *= 1e-9;
            else if (p === 'µ') baseValue *= 1e-6;
            else if (p === 'm' && origPrefix === 'm') baseValue *= 1e-3; 
            else if (p === 'm' && origPrefix === 'M') baseValue *= 1e6; 
            else if (p === 'k') baseValue *= 1e3;
            else if (p === 'g') baseValue *= 1e9;

            let absVal = Math.abs(baseValue);
            let stdNum, stdPrefix;
            if (type === 'F' || type === 'H') {
                if (absVal >= 1e-6) { stdNum = baseValue / 1e-6; stdPrefix = 'µ'; }
                else if (absVal >= 1e-9) { stdNum = baseValue / 1e-9; stdPrefix = 'n'; }
                else if (absVal >= 1e-12) { stdNum = baseValue / 1e-12; stdPrefix = 'p'; }
                else { stdNum = baseValue; stdPrefix = ''; }
            } else if (type === 'Ω') {
                if (absVal >= 1e6) { stdNum = baseValue / 1e6; stdPrefix = 'M'; }
                else if (absVal >= 1e3) { stdNum = baseValue / 1e3; stdPrefix = 'k'; }
                else if (absVal < 1) { stdNum = baseValue / 1e-3; stdPrefix = 'm'; }
                else { stdNum = baseValue; stdPrefix = ''; }
            } else { return v; }
            
            let strNum = parseFloat(stdNum.toPrecision(6)).toString();
            return strNum + stdPrefix + type;
        }

        function getFieldValue(row, possibleNames) {
            const rowKeys = Object.keys(row);
            for (const name of possibleNames) {
                const nameLower = name.toLowerCase().trim();
                const matchKey = rowKeys.find(k => k.trim().toLowerCase() === nameLower);
                if (matchKey) return row[matchKey];
            }
            return '';
        }

        const IconTrash = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
        const IconEdit = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>';
        const IconChevron = '<svg class="collapse-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
        const IconInfo = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
        
        function getInfoBtn(val, lcsc, mouser) {
            const safeVal = (val || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const safeLcsc = (lcsc || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const safeMouser = (mouser || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
            return `<button class="btn-icon" onclick="showComponentUsage('${safeVal}', '${safeLcsc}', '${safeMouser}')" title="Où est-ce utilisé ?">${IconInfo}</button>`;
        }

        async function showComponentUsage(val, lcsc, mouser) {
            if(!db) return;
            // Récupère tous les éléments avec la même valeur pour filtrer localement (gère le problème null vs "")
            const { data: matches, error } = await db.from('bom_items')
                .select('qty, lcsc, mouser, devices(name)')
                .eq('value', val);
                
            if(error) return console.error(error);
            
            // Filtrage strict en JS pour éviter les soucis de null/empty string de Supabase
            const strictMatches = matches.filter(m => {
                const m_lcsc = m.lcsc || '';
                const m_mouser = m.mouser || '';
                return m_lcsc === (lcsc || '') && m_mouser === (mouser || '');
            });
            
            const usage = {};
            strictMatches.forEach(m => {
                const devName = m.devices?.name || 'N/A';
                if(!usage[devName]) usage[devName] = 0;
                usage[devName] += m.qty;
            });
            
            let body = '';
            if (Object.keys(usage).length === 0) {
                body = '<p class="text-muted" style="text-align: center; padding: 20px;">Ce composant n\'est utilisé dans aucun appareil.</p>';
            } else {
                body = '<div style="max-height: 300px; overflow-y: auto;"><table style="margin-top:0; border:1px solid var(--border-color); border-radius:6px;"><thead><tr><th>Appareil</th><th style="text-align:right;">Quantité</th></tr></thead><tbody>';
                for (const [devName, qty] of Object.entries(usage)) {
                    body += `<tr><td style="padding: 10px 14px;">${devName}</td><td style="padding: 10px 14px; text-align: right; font-weight: 500;">${qty}</td></tr>`;
                }
                body += '</tbody></table></div>';
            }
            
            openModal(`Utilisation du composant`, body, `<button class="btn" onclick="closeModal()">Fermer</button>`);
        }

        // --- MODALES PERSONNALISÉES ---
        function openModal(title, bodyHtml, footerHtml) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-footer').innerHTML = footerHtml;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }
        
        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        function overlayClick(event) {
            if (event.target.id === 'modal-overlay') {
                handlePromiseModal(false);
            }
        }

        function showCustomAlert(title, message, okText = "OK") {
            return new Promise((resolve) => {
                const body = `<div style="padding: 10px 0; color: var(--text-main); font-size: 0.95rem; line-height: 1.5;">${message}</div>`;
                const footer = `<button class="btn" onclick="handlePromiseModal(true)">${okText}</button>`;
                window.resolvePromiseModal = resolve;
                openModal(title, body, footer);
            });
        }

        function showCustomConfirm(title, message, confirmText = "Confirmer", cancelText = "Annuler") {
            return new Promise((resolve) => {
                const body = `<div style="padding: 10px 0; color: var(--text-main); font-size: 0.95rem; line-height: 1.5;">${message}</div>`;
                const footer = `
                    <button class="btn btn-secondary" onclick="handlePromiseModal(false)">${cancelText}</button>
                    <button class="btn" onclick="handlePromiseModal(true)">${confirmText}</button>
                `;
                window.resolvePromiseModal = resolve;
                openModal(title, body, footer);
            });
        }

        function handlePromiseModal(result) {
            closeModal();
            if (window.resolvePromiseModal) {
                const resolve = window.resolvePromiseModal;
                window.resolvePromiseModal = null;
                resolve(result);
            }
        }

        // --- DEVICES & BOM ---

            if(!db) return;

            if (error) return console.error(error);
            currentDevices = data;
            
            const container = document.getElementById('devices-list');
            container.innerHTML = '';
            
            if(data.length === 0) {
                container.innerHTML = '<p class="text-muted">Aucun appareil. Ajoutez-en un pour commencer.</p>';

                card.innerHTML = `
                    <div class="device-header" onclick="toggleCollapse(${device.id})">
                        <div class="device-name">
                            ${IconChevron}
                            ${device.name}
                            <span class="built-badge">Construits: ${device.built_count}</span>
                        </div>
                        <div onclick="event.stopPropagation()" style="display:flex; gap:8px;">

        async function importCsv(deviceId, file) {
            if(!file) return;
            Papa.parse(file, {
                header: true,
                complete: async function(results) {
                    const rows = results.data.map(row => ({
                        device_id: deviceId,
                        reference: getFieldValue(row, ['Reference', 'Ref']),
                        qty: parseInt(getFieldValue(row, ['Qty', 'Quantity'])) || 1,
                        value: getFieldValue(row, ['Value', 'Description', 'Component']),
                        lcsc: getFieldValue(row, ['LCSC part number', 'LCSC Part Number', 'LCSC']),
                        mouser: getFieldValue(row, ['Mouser part number', 'Mouser Part Number', 'Mouser']),
                        excluded: false,
                        is_manual: false
                    })).filter(r => r.value !== '' || r.reference !== '');

                    if(rows.length === 0) return await showCustomAlert("Importation", "Aucune donnée valide trouvée dans le CSV.");
                    const { error } = await db.from('bom_items').insert(rows);
                    if(error) return console.error(error);
                    await showCustomAlert("Importation réussie", rows.length + ' composants importés avec succès !');
                    loadBomItems(deviceId);
                }
            });
        }

        // --- ANALYSE DES CONFLITS (INLINE) ---
        async function loadAndAnalyzeConflicts() {
            if(!db) return;
            const { data: items, error } = await db.from('bom_items').select('*, devices(name)').order('value');
            if(error) return console.error(error);
            
            currentNonStandardItems = [];
            const processedItems = items.map(item => {
                const originalVal = (item.value || '').trim();
                const stdVal = standardizeValue(originalVal, item.reference);
                if(originalVal !== stdVal) {
                    currentNonStandardItems.push({ id: item.id, originalValue: originalVal, standardValue: stdVal });
                }
                return { ...item, standardizedValue: stdVal };
            });

            const { data: ignored, error: errIgn } = await db.from('ignored_conflicts').select('*');
            if(errIgn) return console.error(errIgn);
            
            const ignoredKeys = new Set(ignored.map(i => i.conflict_key));

            const byValue = {};
            processedItems.forEach(item => {
                const val = normalizeValue(item.standardizedValue);
                if(val === '') return;
                if(!byValue[val]) byValue[val] = [];
                byValue[val].push(item);
            });

            const refConflicts = [];
            for(const val in byValue) {
                const itemsWithVal = byValue[val];
                if(itemsWithVal.length > 1) {
                    const uniqueValues = new Set();
                    const uniqueParts = {};
                    itemsWithVal.forEach(item => {
                        uniqueValues.add(item.standardizedValue);
                        const lcsc = (item.lcsc || '').trim();
                        const mouser = (item.mouser || '').trim();
                        const key = lcsc + '|' + mouser;
                        if(!uniqueParts[key]) {
                            uniqueParts[key] = { lcsc, mouser, sources: [] };
                        }
                        uniqueParts[key].sources.push((item.devices && item.devices.name ? item.devices.name : 'N/A') + ' (' + item.qty + ')');
                    });

                    const conflictKey = 'val-ref:' + val;
                    if(Object.keys(uniqueParts).length > 1 && !ignoredKeys.has(conflictKey)) {
                        refConflicts.push({
                            key: conflictKey,
                            values: Array.from(uniqueValues),
                            parts: Object.values(uniqueParts),
                            item_ids: itemsWithVal.map(i => i.id)
                        });
                    }
                }
            }

            const byPart = {};
            processedItems.forEach(item => {
                const lcsc = (item.lcsc || '').trim();
                const mouser = (item.mouser || '').trim();
                if(!lcsc && !mouser) return;
                
                const key = lcsc + '|' + mouser;
                if(!byPart[key]) byPart[key] = [];
                byPart[key].push(item);
            });

            const valConflicts = [];
            for(const key in byPart) {
                const itemsWithPart = byPart[key];
                if(itemsWithPart.length > 1) {
                    const uniqueValues = {};
                    itemsWithPart.forEach(item => {
                        const val = item.standardizedValue;
                        if(!uniqueValues[val]) {
                            uniqueValues[val] = { value: val, sources: [] };
                        }
                        uniqueValues[val].sources.push((item.devices && item.devices.name ? item.devices.name : 'N/A') + ' (' + item.qty + ')');
                    });

                    const conflictKey = 'ref-val:' + key;
                    if(Object.keys(uniqueValues).length > 1 && !ignoredKeys.has(conflictKey)) {
                        valConflicts.push({
                            key: conflictKey,
                            lcsc: itemsWithPart[0].lcsc || '',
                            mouser: itemsWithPart[0].mouser || '',
                            values: Object.values(uniqueValues),
                            item_ids: itemsWithPart.map(i => i.id)
                        });
                    }
                }
            }

            currentRefConflicts = refConflicts;
            currentValConflicts = valConflicts;
            renderConflicts(refConflicts, valConflicts, currentNonStandardItems);
        }

        function renderConflicts(refConflicts, valConflicts, nonStandardItems) {
            const section = document.getElementById('conflicts-section');
            
            if(refConflicts.length === 0 && valConflicts.length === 0 && nonStandardItems.length === 0) {
                section.classList.add('hidden');
                return;
            }

            section.classList.remove('hidden');
            section.className = 'conflict-card';
            
            let html = '<h3>Conflits détectés</h3>';

            if(nonStandardItems.length > 0) {
                html += `
                    <div style="margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--conflict-border);">
                        <div class="conflict-section-title">Valeurs non standard :</div>
                        <div class="conflict-item">
                            <div class="conflict-info"><strong>${nonStandardItems.length} composant(s)</strong> ont des valeurs non standard (ex: "10 uF", "4k7").</div>
                            <div class="conflict-actions">
                                <button class="btn" onclick="standardizeValuesInDb()">Standardiser les valeurs</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            if(refConflicts.length > 0) {
                html += '<div style="margin-bottom: 16px;"><div class="conflict-section-title">Valeurs identiques, Réfs différentes :</div>';
                refConflicts.forEach(c => {
                    let partsHtml = c.parts.map(p => `LCSC: ${p.lcsc || '-'} / Mouser: ${p.mouser || '-'} <span class="text-muted">(${p.sources.join(', ')})</span>`).join('<br>');
                    html += `
                        <div class="conflict-item">
                            <div class="conflict-info"><strong>${c.values.join(' / ')}</strong><br>${partsHtml}</div>
                            <div class="conflict-actions">
                                <button class="btn" onclick="openRefFixModal('${c.key}')">Corriger</button>
                                <button class="btn btn-secondary" onclick="ignoreConflict('${c.key}', 'ref')">Ignorer</button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            if(valConflicts.length > 0) {
                html += '<div><div class="conflict-section-title">Réfs identiques, Valeurs différentes :</div>';
                valConflicts.forEach(c => {
                    let valuesHtml = c.values.map(v => `<strong>${v.value || '-'}</strong> <span class="text-muted">(${v.sources.join(', ')})</span>`).join('<br>');
                    html += `
                        <div class="conflict-item">
                            <div class="conflict-info">LCSC: ${c.lcsc || '-'} / Mouser: ${c.mouser || '-'}<br>${valuesHtml}</div>
                            <div class="conflict-actions">
                                <button class="btn" onclick="openValueFixModal('${c.key}')">Corriger</button>
                                <button class="btn btn-secondary" onclick="ignoreConflict('${c.key}', 'val')">Ignorer</button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            section.innerHTML = html;
        }

        async function standardizeValuesInDb() {
            const items = currentNonStandardItems;
            if(items.length === 0) return;

            let listHtml = '<div style="max-height: 300px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px;">';
            items.forEach(item => {
                listHtml += `<div style="padding: 4px 0; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between;">
                    <span style="color: var(--text-muted); text-decoration: line-through;">${item.originalValue}</span>
                    <span style="margin: 0 10px; color: var(--text-muted);">&rarr;</span>
                    <span style="font-weight: 500; color: var(--success);">${item.standardValue}</span>
                </div>`;
            });
            listHtml += '</div>';

            const confirmStd = await showCustomConfirm(
                "Standardisation",
                `Voulez-vous vraiment standardiser les valeurs de <strong>${items.length} composant(s)</strong> ?<br>${listHtml}`,
                "Standardiser",
                "Annuler"
            );
            if(!confirmStd) return;

            for(const item of items) {
                await db.from('bom_items').update({ value: item.standardValue }).eq('id', item.id);
            }

            await showCustomAlert("Succès", "Valeurs standardisées avec succès.");
            loadDevices(); 
            loadAndAnalyzeConflicts(); 
        }

        async function ignoreConflict(conflictKey, type) {
            const { error } = await db.from('ignored_conflicts').insert([{ conflict_key: conflictKey, conflict_type: type }]);
            if(error) return console.error(error);
            loadAndAnalyzeConflicts();
        }

        function openRefFixModal(conflictKey) {
            const conflict = currentRefConflicts.find(c => c.key === conflictKey);
            if(!conflict) return;

            let optionsHtml = conflict.parts.map((p, i) => 
                `<option value="${i}">LCSC: ${p.lcsc || '-'} / Mouser: ${p.mouser || '-'}</option>`
            ).join('');
            
            const body = `
                <p class="text-muted" style="margin-bottom: 16px;">Valeurs: <strong>${conflict.values.join(', ')}</strong><br>Choisissez la référence (LCSC/Mouser) à appliquer partout :</p>
                <div class="form-group">
                    <select id="fix-ref-select" style="width: 100%;">${optionsHtml}</select>
                </div>
            `;
            const footer = `<button class="btn btn-secondary" onclick="closeModal()">Annuler</button><button class="btn" onclick="applyRefFix('${conflictKey}')">Appliquer</button>`;
            openModal("Corriger la référence", body, footer);
        }

        async function applyRefFix(conflictKey) {
            const conflict = currentRefConflicts.find(c => c.key === conflictKey);
            if(!conflict) return;

            const selectedIndex = document.getElementById('fix-ref-select').value;
            const selectedPart = conflict.parts[selectedIndex];

            const { error } = await db.from('bom_items')
                .update({ lcsc: selectedPart.lcsc, mouser: selectedPart.mouser })
                .in('id', conflict.item_ids); 
                
            if(error) return await showCustomAlert("Erreur", "Erreur lors de la mise à jour.");
            
            closeModal();

        async function importInventoryCsv(file) {
            if(!file) return;
            Papa.parse(file, {
                header: true,
                complete: async function(results) {
                    const rows = results.data.map(row => ({
                        value: getFieldValue(row, ['Value', 'Description', 'Component']),
                        qty: parseInt(getFieldValue(row, ['Qty', 'Quantity'])) || 0,
                        lcsc: getFieldValue(row, ['LCSC part number', 'LCSC Part Number', 'LCSC']),
                        mouser: getFieldValue(row, ['Mouser part number', 'Mouser Part Number', 'Mouser'])
                    })).filter(r => r.value !== '' || r.lcsc !== '' || r.mouser !== '');

                    if(rows.length === 0) return await showCustomAlert("Importation", "Aucune donnée valide trouvée dans le CSV.");

                    const { data: invItems } = await db.from('inventory').select('*');
            
                    let addedCount = 0;
                    let updatedCount = 0;

                    for (const item of rows) {
                        let existing = invItems.find(i => 
                            (i.lcsc === item.lcsc || (!i.lcsc && !item.lcsc)) && 
                            (i.mouser === item.mouser || (!i.mouser && !item.mouser))
                        );

                        if(existing) {
                            await db.from('inventory').update({ qty: existing.qty + item.qty }).eq('id', existing.id);
                            updatedCount++;
                        } else {
                            await db.from('inventory').insert([{ 
                                value: item.value, lcsc: item.lcsc, mouser: item.mouser, qty: item.qty 
                            }]);
                            addedCount++;
                        }
                    }

                    await showCustomAlert("Importation réussie", `${addedCount} nouveau(x) composant(s) ajouté(s) et ${updatedCount} mise(s) à jour.`);
                    loadInventory();
                }
            });
        }

        async function openAddFromBomModal() {

        function renderBomModalTable() {

            window.tempBomComponents.forEach((c, i) => {

                    (c.lcsc && c.lcsc.toLowerCase().includes(query)) ||

        async function generateFinalBom() {
            const { data: devices } = await db.from('devices').select('*');
            const { data: invItems } = await db.from('inventory').select('*');
            currentInventory = invItems || [];

            const quantities = {};
            let hasSelection = false;

            for (const dev of devices) {
                const qty = parseInt(document.getElementById('qty-' + dev.id).value) || 0;
                if(qty > 0) {
                    quantities[dev.id] = qty;
                    hasSelection = true;
                }
            }

            if(!hasSelection) return await showCustomAlert("Génération BOM", "Entrez une quantité supérieure à 0 pour au moins un appareil.");

            finalBomData = {};
            for (const devId in quantities) {
                const qtyToBuild = quantities[devId];
                const { data: items } = await db.from('bom_items').select('*').eq('device_id', devId).eq('excluded', false);
                for (const item of items) {
                    const val = (item.value || '').trim();
                    const lcsc = (item.lcsc || '').trim();
                    const mouser = (item.mouser || '').trim();
                    const key = val + '|' + lcsc + '|' + mouser;
                    if(!finalBomData[key]) {
                        finalBomData[key] = { key, value: val, lcsc: lcsc, mouser: mouser, totalQty: 0 };
                    }
                    finalBomData[key].totalQty += item.qty * qtyToBuild;
                }
            }

            const tbody = document.getElementById('final-bom-table-body');
            tbody.innerHTML = '';
            for (const item of Object.values(finalBomData)) {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.value || '-'}</td>
                        <td><strong>${item.totalQty}</strong></td>
                        <td>${createSupplierLink(item.lcsc, 'lcsc')}</td>
                        <td>${createSupplierLink(item.mouser, 'mouser')}</td>
                        <td style="width: 40px; text-align: right;">${getInfoBtn(item.value, item.lcsc, item.mouser)}</td>
                    </tr>
                `;
            }

            missingData = [];
            activeSubstitutions = []; 

            for (const key in finalBomData) {
                const bomItem = finalBomData[key];
                const invItem = currentInventory.find(i => 
                    ((i.lcsc || '').trim() === bomItem.lcsc || (!i.lcsc && !bomItem.lcsc)) && 
                    ((i.mouser || '').trim() === bomItem.mouser || (!i.mouser && !bomItem.mouser))
                );
                const invQty = invItem ? invItem.qty : 0;
                const missingQty = Math.max(0, bomItem.totalQty - invQty);
                
                if(missingQty > 0) {
                    missingData.push({ ...bomItem, missingQty });
                }
            }

            renderMissingSection();
            document.getElementById('final-bom-section').classList.remove('hidden');
        }

        function renderMissingSection() {
            const section = document.getElementById('missing-components-section');
            if(missingData.length === 0) {
                section.classList.add('hidden');
                return;
            }

            let totalMissing = missingData.reduce((sum, item) => sum + item.missingQty, 0);
            let substitutedCount = activeSubstitutions.reduce((sum, sub) => sum + sub.subQty, 0);
            let displayMissing = Math.max(0, totalMissing - substitutedCount);

            section.classList.remove('hidden');
            section.className = 'missing-card';
            section.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 style="font-size:1rem; margin:0;">Composants manquants à l'inventaire</h3>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span class="text-danger" style="font-size: 0.85rem; font-weight: 500;">Total restant: ${displayMissing}</span>
                        <button class="btn-icon" onclick="exportMissingCsv()" title="Télécharger BOM Manquants CSV">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        </button>
                    </div>
                </div>
                <table style="margin-top: 0; border: 1px solid var(--warning-border); background: var(--surface-color);">
                    <thead>
                        <tr><th>Valeur</th><th>LCSC</th><th>Mouser</th><th>Manquant</th><th>Actions</th><th style="width: 40px;"></th></tr>
                    </thead>
                    <tbody>
                        ${missingData.map(item => {
                            let substitutedQtyForItem = activeSubstitutions
                                .filter(sub => sub.originalKey === item.key)
                                .reduce((sum, sub) => sum + sub.subQty, 0);
                            let remainingMissing = Math.max(0, item.missingQty - substitutedQtyForItem);
                            
                            return `
                                <tr>
                                    <td>${item.value || '-'}</td>
                                    <td>${createSupplierLink(item.lcsc, 'lcsc')}</td>
                                    <td>${createSupplierLink(item.mouser, 'mouser')}</td>
                                    <td class="${remainingMissing > 0 ? 'text-danger' : 'text-muted'}">${remainingMissing} / ${item.missingQty}</td>
                                    <td>
                                        <button class="btn btn-secondary" onclick="openSubstitutionModal('${item.key}')">Substituer</button>
                                    </td>
                                    <td style="text-align: right;">${getInfoBtn(item.value, item.lcsc, item.mouser)}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
                <div style="margin-top: 12px;">
                    <h4 class="text-muted" style="font-size: 0.9rem; margin-bottom: 8px;">Substitutions actives :</h4>
                    ${activeSubstitutions.length === 0 ? '<p class="text-muted" style="font-size: 0.85rem;">Aucune substitution configurée.</p>' : `
                        <ul style="list-style: none; padding: 0;">
                            ${activeSubstitutions.map((sub, index) => `
                                <li style="display: flex; justify-content: space-between; align-items: center; padding: 8px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 4px;">
                                    <span style="font-size: 0.85rem;">
                                        <strong>${sub.subQty}x</strong> ${sub.subValue} ${sub.subLcsc ? '(LCSC: '+sub.subLcsc+')' : ''}
                                        <span class="text-muted">remplace ${sub.originalValue}</span>
                                    </span>
                                    <button class="btn btn-danger" onclick="removeSubstitution(${index})">Retirer</button>
                                </li>
                            `).join('')}
                        </ul>
                    `}
                </div>
            `;
        }

        function openSubstitutionModal(originalKey) {
            const missingItem = missingData.find(m => m.key === originalKey);
            if(!missingItem) return;

            let substitutedQtyForItem = activeSubstitutions
                .filter(sub => sub.originalKey === originalKey)
                .reduce((sum, sub) => sum + sub.subQty, 0);
            let remainingMissing = Math.max(0, missingItem.missingQty - substitutedQtyForItem);

            const body = `
                <p class="text-muted" style="margin-bottom: 16px;">Composant manquant : <strong>${missingItem.value}</strong> (LCSC: ${missingItem.lcsc || '-'}, Mouser: ${missingItem.mouser || '-'}).<br>Il reste <strong>${remainingMissing}</strong> à substituer.</p>
                <div class="form-group">
                    <label>Rechercher un composant dans l'inventaire</label>
                    <input type="text" id="sub-inv-search" placeholder="Tapez pour rechercher..." oninput="filterSubInvOptions()" autocomplete="off">
                    <div id="sub-inv-dropdown" class="sub-dropdown"></div>
                    <input type="hidden" id="sub-inv-id">
                </div>
                <div class="form-group">
                    <label>Quantité à substituer</label>
                    <input type="number" id="sub-qty" min="1" max="${remainingMissing}" value="${remainingMissing}">
                </div>
            `;
            const footer = `<button class="btn btn-secondary" onclick="closeModal()">Annuler</button><button class="btn" onclick="confirmSubstitution('${originalKey}')">Valider la substitution</button>`;
            openModal("Substitution de composant", body, footer);
            renderSubInvOptions();
        }

        function renderSubInvOptions(query = '') {
            const dropdown = document.getElementById('sub-inv-dropdown');
            const hiddenInput = document.getElementById('sub-inv-id');
            if(!hiddenInput.value && currentInventory.length > 0) {
                hiddenInput.value = currentInventory[0].id;
            }
            
            dropdown.innerHTML = '';
            const q = query.toLowerCase();
            const filtered = currentInventory.filter(inv => 
                (inv.value || '').toLowerCase().includes(q) || 
                (inv.lcsc || '').toLowerCase().includes(q) || 
                (inv.mouser || '').toLowerCase().includes(q)
            );

            if(filtered.length === 0) {
                dropdown.innerHTML = '<div style="padding: 8px 12px; color: var(--text-muted); font-size: 0.85rem;">Aucun résultat</div>';
                return;
            }

            filtered.forEach(inv => {
                const isSelected = hiddenInput.value == inv.id.toString();
                const itemDiv = document.createElement('div');
                itemDiv.className = 'sub-option' + (isSelected ? ' selected' : '');
                itemDiv.innerHTML = `
                    <div>
                        <strong>${inv.value || '-'}</strong> <span style="color: var(--text-muted); font-size: 0.8rem;">${inv.lcsc ? '(LCSC: '+inv.lcsc+')' : ''} ${inv.mouser ? '(Mouser: '+inv.mouser+')' : ''}</span>
                    </div>
                    <span style="font-size: 0.8rem; color: var(--text-muted);">Stock: ${inv.qty}</span>
                `;
                itemDiv.onclick = () => {
                    hiddenInput.value = inv.id;
                    document.getElementById('sub-inv-search').value = `${inv.value || '-'} ${inv.lcsc ? '(LCSC: '+inv.lcsc+')' : ''} ${inv.mouser ? '(Mouser: '+inv.mouser+')' : ''} [Stock: ${inv.qty}]`;
                    renderSubInvOptions(document.getElementById('sub-inv-search').value);
                };
                dropdown.appendChild(itemDiv);
            });
        }

        function filterSubInvOptions() {
            renderSubInvOptions(document.getElementById('sub-inv-search').value);
        }

        async function confirmSubstitution(originalKey) {
            const invId = parseInt(document.getElementById('sub-inv-id').value);
            const qty = parseInt(document.getElementById('sub-qty').value) || 0;

            if (isNaN(invId)) return await showCustomAlert("Substitution", "Veuillez sélectionner un composant de substitution.");
            if (qty <= 0) return await showCustomAlert("Substitution", "La quantité doit être supérieure à 0.");

            const invItem = currentInventory.find(i => i.id === invId);
            const missingItem = missingData.find(m => m.key === originalKey);

            activeSubstitutions.push({
                originalKey: originalKey,
                originalValue: missingItem.value,
                subInvId: invId,
                subQty: qty,
                subValue: invItem.value,
                subLcsc: invItem.lcsc,
                subMouser: invItem.mouser
            });

            closeModal();
            renderMissingSection();
        }

        function removeSubstitution(index) {
            activeSubstitutions.splice(index, 1);
            renderMissingSection();
        }

        async function exportCsv() {
            if(Object.keys(finalBomData).length === 0) return await showCustomAlert("Exportation", "Générez d'abord la BOM.");
            
            let csv = "Value,Qty,LCSC part number,Mouser part number\n";
            for (const item of Object.values(finalBomData)) {
                csv += '"' + (item.value || '') + '",' + item.totalQty + ',"' + (item.lcsc || '') + '","' + (item.mouser || '') + '"\n';
            }

            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "bom_finale.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function exportMissingCsv() {
            if(missingData.length === 0) return await showCustomAlert("Exportation", "Aucun composant manquant.");
            
            let csv = "Value,Qty,LCSC part number,Mouser part number\n";
            for (const item of missingData) {
                let substitutedQtyForItem = activeSubstitutions
                    .filter(sub => sub.originalKey === item.key)
                    .reduce((sum, sub) => sum + sub.subQty, 0);
                let remainingMissing = Math.max(0, item.missingQty - substitutedQtyForItem);
                
                if(remainingMissing > 0) {
                    csv += '"' + (item.value || '') + '",' + remainingMissing + ',"' + (item.lcsc || '') + '","' + (item.mouser || '') + '"\n';
                }
            }

            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "bom_manquants.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function buildDevices() {
            if(Object.keys(finalBomData).length === 0) {
                return await showCustomAlert("Construction", "Générez d'abord la BOM finale avant de construire.");
            }
            
            const quantities = {};
            const { data: devices } = await db.from('devices').select('*');
            let hasSelection = false;

            for (const dev of devices) {
                const qty = parseInt(document.getElementById('qty-' + dev.id).value) || 0;
                if(qty > 0) {
                    quantities[dev.id] = qty;
                    hasSelection = true;
                }
            }

            if(!hasSelection) return await showCustomAlert("Construction", "Rien à construire.");

            if(activeSubstitutions.length > 0) {
                let subMsg = "Confirmer les substitutions suivantes ?<br><br>";
                activeSubstitutions.forEach(sub => {
                    subMsg += `- <strong>${sub.subQty}x</strong> ${sub.subValue} (LCSC: ${sub.subLcsc || '-'}) remplace ${sub.originalValue}<br>`;
                });
                const confirmSubs = await showCustomConfirm("Substitutions", subMsg, "Poursuivre", "Annuler");
                if(!confirmSubs) return; 
            }

            let totalRemainingMissing = 0;
            for(let item of missingData) {
                let substituted = activeSubstitutions
                    .filter(sub => sub.originalKey === item.key)
                    .reduce((sum, sub) => sum + sub.subQty, 0);
                totalRemainingMissing += Math.max(0, item.missingQty - substituted);
            }

            if(totalRemainingMissing > 0) {
                const confirmMissing = await showCustomConfirm(
                    "Composants manquants", 
                    `Il manque <strong>${totalRemainingMissing}</strong> composants dans l'inventaire. Voulez-vous ignorer et construire quand même ?`,
                    "Ignorer",
                    "Annuler"
                );
                if(!confirmMissing) return; 
            }

            const confirmBuild = await showCustomConfirm(
                "Confirmation de construction", 
                "Voulez-vous vraiment déduire ces composants de l'inventaire ?",
                "Construire",
                "Annuler"
            );
            if(!confirmBuild) return; 

            const { error: rpcError } = await db.rpc('build_devices', { p_quantities: quantities });
            if(rpcError) {
                await showCustomAlert("Erreur", "Erreur lors de la construction principale. Vérifiez la console.");
                return console.error(rpcError);
            }

            const subsByInvId = {};
            activeSubstitutions.forEach(sub => {
                if(!subsByInvId[sub.subInvId]) subsByInvId[sub.subInvId] = 0;
                subsByInvId[sub.subInvId] += sub.subQty;
            });

            for(const invId in subsByInvId) {
                const qtyToDeduct = subsByInvId[invId];
                const { data: invData } = await db.from('inventory').select('qty').eq('id', invId).single();
                if(invData) {
                    const newQty = Math.max(0, invData.qty - qtyToDeduct);
                    await db.from('inventory').update({ qty: newQty }).eq('id', invId);
                }
            }

            await showCustomAlert("Succès", "Construction enregistrée ! L'inventaire a été mis à jour.");
            
            for (const dev of devices) {
                document.getElementById('qty-' + dev.id).value = 0;
            }
            
            activeSubstitutions = [];
            missingData = [];
            finalBomData = {};
            document.getElementById('final-bom-table-body').innerHTML = '';
            document.getElementById('missing-components-section').classList.add('hidden');
            document.getElementById('final-bom-section').classList.add('hidden');
            loadDevices(); 
        }

        // Init
        loadDevices();
    </script>
</body>
</html>
